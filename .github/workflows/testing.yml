name: Tests

on:
  pull_request:
    branches: [ master ]

jobs:
  run-tests:
    # see: https://github.com/actions/runner-images?tab=readme-ov-file#available-images
    runs-on: ubuntu-slim

    steps:
      - name: Checkout
        uses: actions/checkout@v6
      # Not specifying version checks package.json `packageManager`, then `engines.bun`, or latest by default.
      # see: https://github.com/oven-sh/setup-bun
      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Cache dependencies
        uses: actions/cache@v5
        with:
          # Default folder, see: # https://bun.com/docs/pm/global-cache
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('**/bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run tests
        run: bun run tests

      - name: Build package
        run: bun run build
